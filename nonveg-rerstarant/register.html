<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - REAL MEAT Pure Non-Veg Restaurant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page-body">

  <div class="auth-card-container">
    
    <!-- Top Back & Logo Bar -->
    <div class="auth-header-bar">
      <a href="index.html" class="back-home-link">← Back to Menu</a>
      <a href="index.html" class="brand-logo-sleek" style="background: rgba(249, 87, 56, 0.08); border-color: rgba(249, 87, 56, 0.2);">
        <div class="logo-icon-pill">🥩</div>
        <div class="logo-text-group">
          <span class="logo-title" style="color: #0f172a;">REAL <span class="accent-orange">MEAT</span></span>
          <span class="logo-tagline" style="color: #64748b;">100% PURE NON-VEG</span>
        </div>
      </a>
    </div>

    <!-- Register Form Box -->
    <div class="auth-form-card">
      <div class="auth-title-group">
        <h2>Create Account 🍗</h2>
        <p>Join REAL MEAT to earn gourmet rewards, 50% first order discounts & fast checkout.</p>
      </div>

      <form id="standaloneRegisterForm" onsubmit="handleStandaloneRegister(event)">
        <div class="form-group">
          <label for="regNameInput">Full Name</label>
          <input type="text" id="regNameInput" placeholder="e.g. John Doe" required />
        </div>

        <div class="form-group">
          <label for="regPhoneInput">Phone Number</label>
          <input type="tel" id="regPhoneInput" placeholder="+91 98765 43210" required />
        </div>

        <div class="form-group">
          <label for="regEmailInput">Email Address</label>
          <input type="email" id="regEmailInput" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label for="regPassInput">Create Password</label>
          <input type="password" id="regPassInput" placeholder="••••••••" required />
        </div>

        <div style="margin-bottom: 16px; font-size: 0.82rem; color: #64748b; font-weight: 600;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" required checked />
            <span>I agree to REAL MEAT Terms of Service & Privacy Policy</span>
          </label>
        </div>

        <button type="submit" class="palmshore-cta-btn" style="width: 100%; justify-content: center; padding: 14px;">
          Create REAL MEAT Account ➔
        </button>
      </form>

      <div class="auth-footer-text">
        Already have an account? <a href="login.html">Sign In Here</a>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    function handleStandaloneRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regNameInput').value;
      const email = document.getElementById('regEmailInput').value;
      const user = { name, email };
      StorageManager.saveUser(user);
      alert(`Account created successfully! Welcome ${name}. Redirecting to menu...`);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
